<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { sound: true }; }
  renderVals() {
    var self = this;
    var on = this.state.sound;
    var stars = [];
    var seed = 5;
    function rand() { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; }
    for (var i = 0; i < 46; i++) {
      stars.push({ left: (rand() * 100).toFixed(2) + "%", top: Math.round(14 + rand() * 300) + "px", size: (rand() < 0.15 ? 3 : 2) + "px", delay: (rand() * 3).toFixed(2) + "s" });
    }
    return {
      stars: stars,
      soundOnCls: on ? "snd on" : "snd",
      soundOffCls: on ? "snd" : "snd on",
      soundOnPressed: on ? "true" : "false",
      soundOffPressed: on ? "false" : "true",
      soundOn: function () { self.setState({ sound: true }); },
      soundOff: function () { self.setState({ sound: false }); }
    };
  }
}
</script>
